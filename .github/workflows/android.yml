name: Android mobile release

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - ".github/workflows/android.yml"
      - "ANDROID.md"
      - "README.md"
      - "RELEASE_NOTES.md"
  pull_request:
    paths:
      - "android/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  NOWAY_ANDROID_VERSION: "2.3.0"
  NOWAY_ANDROID_APK: "NOWAY-CDN-CIDR-Scanner-v2.3.0-Android.apk"

permissions:
  contents: read

jobs:
  build-android:
    name: Test and verify Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Run Android unit tests and assemble APK
        run: gradle :android:testDebugUnitTest :android:assembleDebug --stacktrace --no-daemon
      - name: Verify package, signature, version and archive
        shell: bash
        run: |
          set -euo pipefail
          source_apk="android/build/outputs/apk/debug/android-debug.apk"
          test -s "$source_apk"
          cp "$source_apk" "$NOWAY_ANDROID_APK"
          unzip -tq "$NOWAY_ANDROID_APK"

          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$build_tools/apksigner"
          test -x "$build_tools/aapt"
          "$build_tools/apksigner" verify --verbose --print-certs "$NOWAY_ANDROID_APK"
          badging="$($build_tools/aapt dump badging "$NOWAY_ANDROID_APK")"
          grep -F "package: name='com.noway.edge.debug' versionCode='23' versionName='2.3.0-debug'" <<<"$badging"

          sha256sum "$NOWAY_ANDROID_APK" > SHA256SUMS-Android.txt
          cat SHA256SUMS-Android.txt
      - name: Publish Android test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-report
          path: android/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            ${{ env.NOWAY_ANDROID_APK }}
            SHA256SUMS-Android.txt
          if-no-files-found: error
          retention-days: 30

  publish-android-release:
    name: Publish Android v2.3.0 release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, 'Release NOWAY Android v2.3.0'))
    needs: [build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download verified APK
        uses: actions/download-artifact@v4
        with:
          name: android-release
          path: release
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v${NOWAY_ANDROID_VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber
            gh release edit "$tag" --title "NOWAY v${NOWAY_ANDROID_VERSION} — Android Mobile" --notes-file RELEASE_NOTES.md --latest
          else
            gh release create "$tag" release/* --target "$GITHUB_SHA" --title "NOWAY v${NOWAY_ANDROID_VERSION} — Android Mobile" --notes-file RELEASE_NOTES.md --latest
          fi
